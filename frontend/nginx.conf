# nginx локального стека: раздаёт собранный Angular (SPA) и проксирует /api/ в контейнер api.
# TLS и заголовки production-уровня — в deploy/nginx (compose.yaml — только для разработки).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    client_max_body_size 1m;

    # Docker DNS: имя api переразрешается, поэтому пересоздание контейнера api не требует
    # перезапуска фронтенда (переменная используется в proxy_pass).
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain application/manifest+json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Healthcheck контейнера: не зависит от Api и не пишет access-лог.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Проброс /health в Api (удобно проверять бэкенд через тот же origin).
    location = /health {
        access_log off;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # Контракт API: /api/v1/... — путь передаётся в Api без изменений.
    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        # $http_host, а не $host: refresh-эндпоинт сверяет Origin (с портом) с Host,
        # иначе http://localhost:4201 выглядит как чужой источник и сессия не восстанавливается.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Локальный стек: в Development-сборке main.js/styles.css не хешируются, поэтому
    # кэшировать их нельзя — иначе после пересборки браузер показывает старую версию.
    # no-cache = браузер каждый раз перепроверяет файл по ETag/Last-Modified.
    location ~* \.(?:js|css|woff2?|svg|png|jpe?g|webp|ico)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # SPA-роутинг: любой путь без файла отдаёт index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
