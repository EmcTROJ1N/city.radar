            application/json:
              schema: { $ref: '#/components/schemas/ModerationCase' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /moderation/cases/{id}/reject:
    post:
      tags: [Moderation]
      operationId: rejectModerationCase
      summary: Отклонить кейс
      x-permission: moderation.queue.process
      parameters:
        - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectCaseRequest' }
      responses:
        '200':
          description: Кейс отклонён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModerationCase' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Короткоживущий access-токен; refresh лежит в httpOnly-cookie
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Refresh-токен в httpOnly Secure SameSite cookie

  parameters:
    MapObjectId:
      name: id
      in: path
      required: true
      description: Идентификатор фиксации
      schema: { type: string, format: uuid }
    SourceId:
      name: id
      in: path
      required: true
      description: Идентификатор источника
      schema: { type: string, format: uuid }
    StatusId:
      name: statusId
      in: path
      required: true
      description: Идентификатор статуса источника
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: Курсор из поля `nextCursor` предыдущей страницы
      schema: { type: string }

    UserId:
      name: id
      in: path
      required: true
      description: Идентификатор пользователя
      schema: { type: string, format: uuid }
    SecretId:
      name: id
      in: path
      required: true
      description: Идентификатор секрета (задаёт клиент)
      schema: { type: string, format: uuid }
    CategoryId:
      name: id
      in: path
      required: true
      description: Идентификатор категории
      schema: { type: string, format: uuid }
    ObjectTypeId:
      name: id
      in: path
      required: true
      description: Идентификатор типа объекта
      schema: { type: string, format: uuid }
    GroupId:
      name: id
      in: path
      required: true
      description: Идентификатор группы
      schema: { type: string, format: uuid }
    StatusDefinitionId:
      name: id
      in: path
      required: true
      description: Идентификатор записи справочника статусов
      schema: { type: string, format: uuid }
    ObservationId:
      name: id
      in: path
      required: true
      description: Идентификатор наблюдения
      schema: { type: string, format: uuid }
    CaseId:
      name: id
      in: path
      required: true
      description: Идентификатор кейса модерации
      schema: { type: string, format: uuid }
    SourceIdInPath:
      name: sourceId
      in: path
      required: true
      description: Идентификатор источника
      schema: { type: string, format: uuid }
    UserSearch:
      name: q
      in: query
      description: Поиск по имени
      schema: { type: string, maxLength: 200 }
    RoleFilter:
      name: role
      in: query
      description: Фильтр по роли
      schema: { type: string, enum: [user, moderator, admin] }
    AuditActorId:
      name: actorId
      in: query
      description: Кто совершил действие
      schema: { type: string, format: uuid }
    AuditAction:
      name: action
      in: query
      description: Действие
      schema: { type: string }
    AuditEntityType:
      name: entityType
      in: query
      description: Тип объекта
      schema: { type: string }
    AuditEntityId:
      name: entityId
      in: query
      description: Идентификатор объекта
      schema: { type: string }
    AuditFrom:
      name: from
      in: query
      description: Начало периода
      schema: { type: string, format: date-time }
    AuditTo:
      name: to
      in: query
      description: Конец периода
      schema: { type: string, format: date-time }
    FilterCategoryId:
      name: categoryId
      in: query
      description: Фильтр по категории
      schema: { type: string, format: uuid }
    FilterObjectTypeId:
      name: objectTypeId
      in: query
      description: Фильтр по типу объекта
      schema: { type: string, format: uuid }
    FilterGroupId:
      name: groupId
      in: query
      description: Фильтр по группе
      schema: { type: string, format: uuid }
    FilterSourceId:
      name: sourceId
      in: query
      description: Только фиксации, привязанные к источнику
      schema: { type: string, format: uuid }
    FilterKind:
      name: kind
      in: query
      description: Тип покрытия
      schema: { $ref: '#/components/schemas/CoverageKind' }
    FilterIsActive:
      name: isActive
      in: query
      description: Только активные или неактивные
      schema: { type: boolean }
    ObjectSearch:
      name: q
      in: query
      description: Поиск по названию
      schema: { type: string, maxLength: 200 }
    CaseKind:
      name: kind
      in: query
      description: Вид кейса
      schema: { $ref: '#/components/schemas/ModerationCaseKind' }
    CaseState:
      name: state
      in: query
      description: Состояние кейса
      schema: { $ref: '#/components/schemas/ModerationCaseState', default: open }

  responses:
    Unauthorized:
      description: Нужен вход
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Не авторизован
            status: 401
            detail: Войдите, чтобы выполнить действие
    Forbidden:
      description: Недостаточно прав
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Доступ запрещён
            status: 403
            detail: Требуется право source.manage
    BadRequest:
      description: Некорректный запрос (невалидный query или путь)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Некорректный запрос
            status: 400
            detail: Запрос не может быть обработан
    NotFound:
      description: Не найдено
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Не найдено
            status: 404
            detail: Запрошенный объект не существует
    Conflict:
      description: Конфликт состояния
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Конфликт
            status: 409
            detail: По источнику есть наблюдения. Отключите источник вместо удаления
    ValidationError:
      description: Ошибка валидации
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
          example:
            type: about:blank
            title: Ошибка валидации
            status: 422
            detail: Запрос содержит недопустимые значения
            errors:
              - field: sourceStatusId
                message: Статус не принадлежит выбранному источнику
    TooManyRequests:
      description: Превышен лимит запросов
      headers:
        Retry-After:
          description: Через сколько секунд повторить
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Слишком много запросов
            status: 429
            detail: Повторите попытку позже

  schemas:
    Problem:
      type: object
      description: Ошибка по RFC 7807
      required: [title, status]
      properties:
        type: { type: string, default: 'about:blank' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field: { type: string }
                  message: { type: string }

    Text:
      type: string
      description: Произвольный текст
    NonEmptyText:
      allOf:
        - $ref: '#/components/schemas/Text'
      minLength: 1
      description: Непустой текст (названия, адреса)

    CoverageKind:
      type: string
      enum: [point, polygon]
    SourceType:
      type: string
      enum: [telegram_chat, max_chat, site]
    TelegramMode:
      type: string
      description: |
        Способ чтения Telegram-источника: `bot` — Telegram Bot API (бот состоит в чате),
        `userbot` — аккаунт Telegram через MTProto (читает сторонние группы).
      enum: [bot, userbot]
    ObservationSourceType:
      type: string
      enum: [manual, moderator, telegram, max]
    StatusColor:
      type: string
      description: Ключ палитры оформления
      enum: [ok, limited, none, queue, schedule, stale]
    Freshness:
      type: string
      enum: [fresh, aging, stale]
    SourceState:
      type: string
      enum: [unknown, ok, silent, flood_wait, auth_error, error]

    Me:
      type: object
      required: [id, displayName, roles, permissions]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
      example:
        id: 00000000-0000-0000-0000-0000000000a3
        displayName: Ольга
        roles: [moderator]
        permissions: [map.read, observation.create, source.manage]

    Point:
      type: object
      required: [type, coordinates]
      properties:
        type: { const: Point }
        coordinates:
          type: array
          description: '[долгота, широта]'
          minItems: 2
          maxItems: 2
          items: { type: number }
    Polygon:
      type: object
      required: [type, coordinates]
      properties:
        type: { const: Polygon }
        coordinates:
          type: array
          items:
            type: array
            minItems: 4
            items:
              type: array
              minItems: 2
              maxItems: 2
              items: { type: number }
    Geometry:
      oneOf:
        - $ref: '#/components/schemas/Point'
        - $ref: '#/components/schemas/Polygon'

    StatusView:
      type: object
      description: Итоговый статус фиксации. `null` в `MapFeature.status` означает «неизвестно».
      required: [sourceStatusId, code, name, color, icon, freshness, observedAt, sourceType, observationCount]
      properties:
        sourceStatusId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        color: { $ref: '#/components/schemas/StatusColor' }
        icon: { type: string }
        freshness: { $ref: '#/components/schemas/Freshness' }
        observedAt: { type: string, format: date-time }
        sourceType: { $ref: '#/components/schemas/ObservationSourceType' }
        observationCount: { type: integer, minimum: 0, maximum: 2147483647 }

    MapFeature:
      type: object
      required: [id, name, coverageKind, geometry, status]
      properties:
        id: { type: string, format: uuid }
        name: { $ref: '#/components/schemas/NonEmptyText' }
        coverageKind: { $ref: '#/components/schemas/CoverageKind' }
        geometry: { $ref: '#/components/schemas/Geometry' }
        categoryId: { type: [string, 'null'], format: uuid }
        objectTypeId: { type: [string, 'null'], format: uuid }
        groupId: { type: [string, 'null'], format: uuid }
        address: { type: [string, 'null'] }
        status:
          oneOf:
            - $ref: '#/components/schemas/StatusView'
            - type: 'null'
    MapFeaturesResponse:
      type: object
      required: [generatedAt, items]
      properties:
        generatedAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/MapFeature' }
      example:
        generatedAt: '2026-11-15T09:30:00Z'
        items:
          - id: 00000000-0000-0000-0000-0000000000f1
            name: Колонка на Ленинском
            coverageKind: point
            geometry: { type: Point, coordinates: [37.80, 48.01] }
            categoryId: 00000000-0000-0000-0000-0000000000c1
            objectTypeId: null
            groupId: null
            address: пр. Ленинский, 12
            status:
              sourceStatusId: 00000000-0000-0000-0000-0000000000a9
              code: none
              name: Воды нет
              color: none
              icon: cross
              freshness: fresh
              observedAt: '2026-11-15T09:10:00Z'
              sourceType: telegram
              observationCount: 3

    SourceStatusPublic:
      type: object
      description: Статус источника для выбора в отметке
      required: [id, code, name, color, icon]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        color: { $ref: '#/components/schemas/StatusColor' }
        icon: { type: string }
    SourceCardView:
      type: object
      required: [id, name, sourceType, timeoutSeconds, statuses, lastObservation]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        sourceType: { $ref: '#/components/schemas/SourceType' }
        timeoutSeconds:
          type: integer
          description: Таймаут актуальности источника
        statuses:
          type: array
          items: { $ref: '#/components/schemas/SourceStatusPublic' }
        lastObservation:
          description: Последнее актуальное наблюдение по источнику
          oneOf:
            - $ref: '#/components/schemas/PublicObservation'
            - type: 'null'
    MapObjectCard:
      allOf:
        - $ref: '#/components/schemas/MapFeature'
        - type: object
          required: [sources]
          properties:
            sources:
              type: array
              items: { $ref: '#/components/schemas/SourceCardView' }

    PublicObservation:
      type: object
      description: Отметка без идентификатора автора
      required: [id, status, observedAt, expiresAt, sourceType]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/SourceStatusPublic' }
        observedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        sourceType: { $ref: '#/components/schemas/ObservationSourceType' }
        sourceName: { type: string }
        text:
          type: [string, 'null']
          description: Сообщение чата или комментарий пользователя
        confidence:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        geoDistanceM:
          type: [integer, 'null']
          description: Расстояние от пользователя до фиксации, информационный признак
    ObservationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PublicObservation' }
        nextCursor: { type: [string, 'null'] }

    GeoLocation:
      type: object
      description: Геолокация браузера; используется только для расчёта расстояния, координаты не сохраняются
      required: [lat, lon]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }
    CreateObservationRequest:
      type: object
      required: [mapObjectId, sourceId, sourceStatusId]
      additionalProperties: false
      properties:
        mapObjectId: { type: string, format: uuid }
        sourceId:
          type: string
          format: uuid
          description: Один из источников, привязанных к фиксации
        sourceStatusId:
          type: string
          format: uuid
          description: Статус из списка выбранного источника
        comment:
          type: string
          maxLength: 500
          description: Необязательный текст; максимальная длина — настройка админа
        location: { $ref: '#/components/schemas/GeoLocation' }
      example:
        mapObjectId: 00000000-0000-0000-0000-0000000000f1
        sourceId: 00000000-0000-0000-0000-0000000000e1
        sourceStatusId: 00000000-0000-0000-0000-0000000000a9
        comment: Воды нет с утра
    CreateObservationResponse:
      type: object
      required: [observation, status]
      properties:
        observation: { $ref: '#/components/schemas/PublicObservation' }
        status:
          description: Пересчитанный итоговый статус фиксации
          oneOf:
            - $ref: '#/components/schemas/StatusView'
            - type: 'null'

    SourcePrefilter:
      type: object
      description: Дешёвый префильтр до LLM
      properties:
        keywords:
          type: array
          items: { type: string }
        regex:
          type: array
          items: { type: string }
    SourceUpdate:
      type: object
      required: [name, sourceType, chatId, timeoutSeconds, userPrompt, linkByText]
      additionalProperties: false
      properties:
        name: { $ref: '#/components/schemas/NonEmptyText' }
        sourceType: { $ref: '#/components/schemas/SourceType' }
        mode:
          oneOf:
            - $ref: '#/components/schemas/TelegramMode'
            - type: 'null'
          description: |
            Способ чтения Telegram. Для `telegram_chat` на создании по умолчанию `bot`;
            на изменении отсутствие поля сохраняет текущий способ. Для других типов
            источников не задаётся.
        chatId:
          type: string
          description: Идентификатор или ссылка на чат (зависит от типа)
        timeoutSeconds:
          type: integer
          minimum: 60
          maximum: 2147483647
          description: Таймаут актуальности наблюдений
        confidenceThreshold:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: Порог уверенности LLM; `null` — значение по умолчанию из настроек
        prefilter:
          oneOf:
            - $ref: '#/components/schemas/SourcePrefilter'
            - type: 'null'
        userPrompt:
          type: string
          description: Промпт-фильтр пользователя; системный промпт добавляется автоматически
        linkByText:
          type: boolean
          default: true
          description: Режим «определять фиксацию по тексту сообщения»
    SourceCreate:
      type: object
      additionalProperties: false
      required: [name, sourceType, chatId, timeoutSeconds, userPrompt, linkByText, statuses]
      properties:
        name: { $ref: '#/components/schemas/NonEmptyText' }
        sourceType: { $ref: '#/components/schemas/SourceType' }
        mode:
          oneOf:
            - $ref: '#/components/schemas/TelegramMode'
            - type: 'null'
          description: |
            Способ чтения Telegram. Для `telegram_chat` на создании по умолчанию `bot`;
            на изменении отсутствие поля сохраняет текущий способ. Для других типов
            источников не задаётся.
        chatId:
          type: string
          description: Идентификатор или ссылка на чат (зависит от типа)
        timeoutSeconds:
          type: integer
          minimum: 60
          maximum: 2147483647
          description: Таймаут актуальности наблюдений
        confidenceThreshold:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: Порог уверенности LLM; `null` — значение по умолчанию из настроек
        prefilter:
          oneOf:
            - $ref: '#/components/schemas/SourcePrefilter'
            - type: 'null'
        userPrompt:
          type: string
          description: Промпт-фильтр пользователя; системный промпт добавляется автоматически
        linkByText:
          type: boolean
          default: true
          description: Режим «определять фиксацию по тексту сообщения»
        statuses:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/SourceStatusInput' }
      example:
        name: Чат жильцов Калининского
        sourceType: telegram_chat
        chatId: '@kalininsky_water'
        timeoutSeconds: 21600
        userPrompt: Ищи в чате все упоминания про подачу и прекращение подачи воды.
        linkByText: true
        statuses:
          - code: ok
            name: Вода есть
            description: Подача воды идёт или возобновилась
            color: ok
            icon: drop
          - code: none
            name: Воды нет
            description: Подача воды прекращена
            color: none
            icon: cross
    Source:
      type: object
      additionalProperties: false
      required: [id, name, sourceType, chatId, timeoutSeconds, userPrompt, linkByText, isEnabled, state, statuses, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { $ref: '#/components/schemas/NonEmptyText' }
        sourceType: { $ref: '#/components/schemas/SourceType' }
        mode:
          oneOf:
            - $ref: '#/components/schemas/TelegramMode'
            - type: 'null'
          description: |
            Способ чтения Telegram-источника; `null` для MAX и системного «Сайта».
        categoryId:
          type: [string, 'null']
          format: uuid
          description: |
            Категория системного источника «Сайт»; у источников-чатов `null`.
            «Сайт» создаётся вместе с категорией и доступен фиксациям неявно.
        chatId:
          type: string
          description: Идентификатор или ссылка на чат (зависит от типа)
        timeoutSeconds:
          type: integer
          minimum: 60
          maximum: 2147483647
          description: Таймаут актуальности наблюдений
        confidenceThreshold:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: Порог уверенности LLM; `null` — значение по умолчанию из настроек
        prefilter:
          oneOf:
            - $ref: '#/components/schemas/SourcePrefilter'
            - type: 'null'
        userPrompt:
          type: string
          description: Промпт-фильтр пользователя; системный промпт добавляется автоматически
        linkByText:
          type: boolean
          default: true
          description: Режим «определять фиксацию по тексту сообщения»
        isEnabled: { type: boolean }
        state: { $ref: '#/components/schemas/SourceState' }
        lastMessageAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        statuses:
          type: array
