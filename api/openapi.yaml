openapi: 3.1.0
info:
  title: API портала «Городские ресурсы ДНР»
  version: 0.1.0
  description: |
    Контракт API (contract-first): источник правды для бэкенда, фронтенда и тестов.
    Охват версии 0.1.0 — вертикальный срез: карта, отметки, источники данных.

    Правила:
    - ошибки — RFC 7807 (`application/problem+json`);
    - у каждого метода указано требуемое право в `x-permission`;
    - секреты (сессии Telegram, прокси, ключ LLM) через этот API не читаются и не передаются.
servers:
  - url: http://127.0.0.1:4010
    description: Mock-сервер (npm run mock); Prism отдаёт пути от корня, без префикса /api/v1
  - url: /api/v1
    description: Бэкенд (тот же хост, что и фронтенд)
tags:
  - name: Auth
    description: Идентификация (вход через MAX — заглушка)
  - name: Map
    description: Чтение карты (публичное)
  - name: Observations
    description: Отметки и наблюдения
  - name: Sources
    description: Источники данных и их статусы
  - name: Catalog
    description: Каталог и фиксации на карте (конструктор)
  - name: Moderation
    description: Очередь модерации
  - name: Admin
    description: Пользователи, роли, аудит, настройки, секреты
security:
  - bearerAuth: []

paths:
  /auth/max:
    post:
      tags: [Auth]
      operationId: loginByMax
      summary: Вход через MAX (заглушка)
      description: Механизм входа не определён. Всегда отвечает 501.
      security: []
      x-permission: none
      responses:
        '501':
          description: Авторизация будет доступна позже
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: about:blank
                title: Не реализовано
                status: 501
                detail: Авторизация будет доступна позже

  /me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Профиль и права текущего пользователя
      x-permission: auth
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /map/features:
    get:
      tags: [Map]
      operationId: listMapFeatures
      summary: Фиксации и их текущий статус в видимой области
      description: |
        Читает проекцию текущих статусов. Поддерживает `ETag` / `If-None-Match`:
        если ничего не изменилось, отвечает 304 без тела. Геометрия полигонов
        упрощается в зависимости от `zoom`. Клиент опрашивает метод каждые 30–60 с.
      security: []
      x-permission: map.read
      parameters:
        - name: bbox
          in: query
          required: true
          description: Видимая область `minLon,minLat,maxLon,maxLat` (WGS 84)
          schema:
            type: string
            pattern: '^-?\d+(\.\d+)?(,-?\d+(\.\d+)?){3}$'
            examples: ['37.60,47.90,38.10,48.20']
        - name: zoom
          in: query
          schema: { type: integer, minimum: 0, maximum: 22 }
        - name: categories
          in: query
          description: Фильтр по категориям
          style: form
          explode: false
          schema:
            type: array
            items: { type: string, format: uuid }
        - name: statuses
          in: query
          description: Фильтр по коду статуса (например, `none`)
          style: form
          explode: false
          schema:
            type: array
            items: { type: string }
        - name: kinds
          in: query
          description: Фильтр «только зоны / только точки / всё»
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/CoverageKind' }
        - name: groups
          in: query
          description: Фильтр по группам; значение `none` — фиксации без группы
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              description: Идентификатор группы либо `none`
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Фиксации в области
          headers:
            ETag:
              description: Версия выдачи для условных запросов
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MapFeaturesResponse' }
        '304':
          description: Не изменилось
        '400':
          description: Некорректные параметры
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: about:blank
                title: Некорректный запрос
                status: 400
                detail: Параметр bbox должен содержать четыре числа через запятую
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /map/objects/{id}:
    get:
      tags: [Map]
      operationId: getMapObject
      summary: Карточка фиксации
      description: Статус, источники со списками их статусов (нужны для отметки), время и достоверность.
      security: []
      x-permission: map.read
      parameters:
        - $ref: '#/components/parameters/MapObjectId'
      responses:
        '200':
          description: Карточка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MapObjectCard' }
        '404': { $ref: '#/components/responses/NotFound' }

  /objects/{id}/observations:
    get:
      tags: [Observations]
      operationId: listObjectObservations
      summary: Публичный список отметок фиксации
      description: |
        Последние наблюдения: статус, время, тип источника и текст-основание
        (сообщение чата или комментарий пользователя). Идентификатор автора не
        раскрывается; отозванные отметки не показываются.
      security: []
      x-permission: map.read
      parameters:
        - $ref: '#/components/parameters/MapObjectId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Страница наблюдений (новые сверху)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ObservationPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /observations:
    post:
      tags: [Observations]
      operationId: createObservation
      summary: Ручная отметка статуса
      description: |
        Пользователь выбирает статус источника фиксации. Если у фиксации есть системный
        «Сайт» её категории, отметка по умолчанию идёт по нему; модератор может отметить
        и по привязанному чату. Срок актуальности берётся из таймаута источника. Отметка
        влияет на текущий статус наравне с остальными: побеждает самое свежее наблюдение.
        Фиксацию без типа отметить нельзя (409): у неё нет категории, а значит и «Сайта».
      x-permission: observation.create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateObservationRequest' }
      responses:
        '201':
          description: Отметка создана, статус пересчитан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateObservationResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /sources:
    get:
      tags: [Sources]
      operationId: listSources
      summary: Список источников
      x-permission: source.manage
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: q
          in: query
          description: Поиск по названию
          schema: { type: string, maxLength: 200 }
        - name: sourceType
          in: query
          schema: { $ref: '#/components/schemas/SourceType' }
        - name: isEnabled
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Страница источников
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourcePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Sources]
      operationId: createSource
      summary: Создать источник со статусами
      description: |
        Источник создаётся вместе со списком статусов (минимум один). Системный «Сайт»
        так не создаётся — он появляется только вместе с категорией (422 по `sourceType`).
      x-permission: source.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceCreate' }
      responses:
        '201':
          description: Источник создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Source' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /sources/{id}:
    parameters:
      - $ref: '#/components/parameters/SourceId'
    get:
      tags: [Sources]
      operationId: getSource
      summary: Источник
      x-permission: source.manage
      responses:
        '200':
          description: Источник со статусами
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Source' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Sources]
      operationId: updateSource
      summary: Изменить настройки источника
      description: Статусы источника меняются отдельными методами. Изменения применяются без перезапуска Worker.
      x-permission: source.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceUpdate' }
      responses:
        '200':
          description: Источник обновлён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Source' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Sources]
      operationId: deleteSource
      summary: Удалить источник
      description: |
        Удаляется только источник без наблюдений. Иначе 409 — отключите источник
        (`/sources/{id}/disable`). Системный «Сайт» удалить нельзя (409): он удаляется
        только вместе с категорией.
      x-permission: source.manage
      responses:
        '204':
          description: Удалён
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /sources/{id}/enable:
    post:
      tags: [Sources]
      operationId: enableSource
      summary: Включить источник
      x-permission: source.manage
      parameters:
        - $ref: '#/components/parameters/SourceId'
      responses:
        '200':
          description: Источник включён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Source' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /sources/{id}/disable:
    post:
      tags: [Sources]
      operationId: disableSource
      summary: Выключить источник
      x-permission: source.manage
      parameters:
        - $ref: '#/components/parameters/SourceId'
      responses:
        '200':
          description: Источник выключен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Source' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /sources/{id}/health:
    get:
      tags: [Sources]
      operationId: getSourceHealth
      summary: Состояние источника
      x-permission: source.manage
      parameters:
        - $ref: '#/components/parameters/SourceId'
      responses:
        '200':
          description: Состояние
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceHealth' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /sources/{id}/statuses:
    parameters:
      - $ref: '#/components/parameters/SourceId'
    get:
      tags: [Sources]
      operationId: listSourceStatuses
      summary: Статусы источника
      x-permission: source.manage
      responses:
        '200':
          description: Список статусов
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SourceStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Sources]
      operationId: createSourceStatus
      summary: Добавить статус источнику
      x-permission: source.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceStatusInput' }
      responses:
        '201':
          description: Статус создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /sources/{id}/statuses/{statusId}:
    parameters:
      - $ref: '#/components/parameters/SourceId'
      - $ref: '#/components/parameters/StatusId'
    put:
      tags: [Sources]
      operationId: updateSourceStatus
      summary: Изменить статус источника
      x-permission: source.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceStatusInput' }
      responses:
        '200':
          description: Статус обновлён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Sources]
      operationId: deleteSourceStatus
      summary: Удалить статус источника
      description: Статус, по которому есть наблюдения, удалить нельзя (409).
      x-permission: source.manage
      responses:
        '204':
          description: Удалён
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Обновить access-токен
      description: |
        Refresh-токен передаётся httpOnly-cookie `refresh_token` (Secure; SameSite=Strict;
        Path=/api/v1/auth). Защита от CSRF: обязателен заголовок `X-Requested-With: mayak`;
        если запрос содержит `Origin`, он должен совпадать с хостом запроса или с
        `Cors:AllowedOrigins`. Нарушение — 403. Нет cookie, токен неизвестен, истёк или уже
        использован — 401. Повторное использование отозванного токена отзывает все активные
        refresh-токены пользователя.
      security: [{ refreshCookie: [] }]
      x-permission: none
      responses:
        '200':
          description: Новый access-токен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Выйти (отозвать refresh-токен)
      x-permission: auth
      responses:
        '204':
          description: Выход выполнен
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/users:
    get:
      tags: [Admin]
      operationId: listUsers
      summary: Список пользователей
      x-permission: users.roles.assign
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/UserSearch'
        - $ref: '#/components/parameters/RoleFilter'
      responses:
        '200':
          description: Страница пользователей
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/users/{id}/roles:
    put:
      tags: [Admin]
      operationId: setUserRoles
      summary: Назначить набор ролей пользователю
      description: Заменяет набор ролей целиком; снять роль модератора — передать набор без неё. Действие пишется в аудит.
      x-permission: users.roles.assign
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetRolesRequest' }
      responses:
        '200':
          description: Пользователь обновлён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/audit:
    get:
      tags: [Admin]
      operationId: listAudit
      summary: Журнал аудита
      description: Только чтение; записи неизменяемы. Фильтры по пользователю, действию, периоду и объекту.
      x-permission: audit.read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/AuditActorId'
        - $ref: '#/components/parameters/AuditAction'
        - $ref: '#/components/parameters/AuditEntityType'
        - $ref: '#/components/parameters/AuditEntityId'
        - $ref: '#/components/parameters/AuditFrom'
        - $ref: '#/components/parameters/AuditTo'
      responses:
        '200':
          description: Страница записей (новые сверху)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/settings:
    get:
      tags: [Admin]
      operationId: getSettings
      summary: Глобальные настройки
      x-permission: settings.global.manage
      responses:
        '200':
          description: Настройки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GlobalSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Admin]
      operationId: updateSettings
      summary: Изменить глобальные настройки
      description: "Частичное обновление: передаются только изменяемые поля."
      x-permission: settings.global.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GlobalSettingsPatch' }
      responses:
        '200':
          description: Настройки после изменения
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GlobalSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/secrets:
    get:
      tags: [Admin]
      operationId: listSecrets
      summary: Список секретов (без значений)
      description: "Только метаданные: вид, название, наличие значения. Сами значения не возвращаются никогда."
      x-permission: source.secrets.manage
      responses:
        '200':
          description: Секреты
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SecretMeta' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/secrets/telegram-sessions/{id}:
    put:
      tags: [Admin]
      operationId: putTelegramSession
      summary: Загрузить или заменить токен Telegram-бота
      description: "Write-only: токен бота сохраняется зашифрованным и наружу не отдаётся. Идентификатор задаёт клиент (создание или замена)."
      x-permission: source.secrets.manage
      parameters:
        - $ref: '#/components/parameters/SecretId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelegramSessionSecret' }
      responses:
        '204':
          description: Сохранено
        '401': { $ref: '#/components/responses/Unauthorized' }
