# Только для локальной разработки: публикуем порты на loopback и храним данные в именованном томе.
services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

volumes:
  pgdata:
