# Reverse-proxy: TLS-терминация, проксирование /api на api, заголовки безопасности и
# грубый rate limit как дополнение к лимитам приложения.
#
# Статика фронтенда здесь не раздаётся: сборка Angular в этап 8.3 не входит (TODO — отдельный
# шаг деплоя фронтенда, см. docs/runbook-backend.md).

worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;

    # В API нет загрузки файлов: тело запроса небольшое.
    client_max_body_size 1m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    # Дополнение к rate limit приложения: лимит по IP на входе в кластер.
    # Точные лимиты «пользователь/IP/объект» считает приложение в Redis.
    limit_req_zone $binary_remote_addr zone=api_all:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=api_write:10m rate=5r/s;
    limit_req_status 429;

    gzip on;
    gzip_types application/json application/problem+json text/plain;
    gzip_min_length 1024;
    gzip_vary on;

    # Docker DNS: имя api переразрешается раз в 10 секунд, поэтому пересоздание контейнера api
    # не требует перезапуска прокси (используется переменная в proxy_pass).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- HTTPS: основной вход -------------------------------------------------------------
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        # Заглушка TLS: сертификат генерируется при старте контейнера (deploy/nginx/Dockerfile).
        # TODO: заменить на сертификат Let's Encrypt/корпоративный, смонтировав его в /etc/nginx/certs.
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1h;
        ssl_session_tickets off;

        set $api_upstream http://api:8080;

        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/api-locations.conf;
    }

    # ---- HTTP ------------------------------------------------------------------------------
    # Оставлен для ACME-проверок и отладки/healthcheck. TODO: после выпуска сертификата включить
    # редирект на HTTPS, сохранив location /.well-known/acme-challenge/.
    server {
        listen 80 default_server;
        server_name _;

        set $api_upstream http://api:8080;

        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/api-locations.conf;
    }
}
