# Маршруты API через reverse-proxy. Подключается в оба server-блока (HTTP и HTTPS).
# Переменная $api_upstream объявлена в server-блоке — так Docker DNS переразрешает имя api.

# Healthcheck самого прокси: не ходит в Api, чтобы не зависеть от его состояния.
location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# Healthcheck Api: без авторизации и без rate limit (используется compose и мониторингом).
location = /health {
    access_log off;
    proxy_pass $api_upstream/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
}

# Контракт API и всё приложение: /api/v1/...
location /api/ {
    # Грубый лимит по IP; точные лимиты — в приложении (Redis).
    limit_req zone=api_all burst=100 nodelay;

    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Буферизация ответов: карта отдаётся редко и маленькими порциями, но большие bbox
    # выигрывают от сжатия и keepalive до upstream.
    proxy_buffering on;
    proxy_busy_buffers_size 16k;
}

# Ошибки прокси — тоже application/problem+json (RFC 7807, как в Api).
error_page 429 = @too_many_requests;
location @too_many_requests {
    default_type application/problem+json;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Retry-After 1 always;
    return 429 '{"type":"about:blank","title":"Слишком много запросов","status":429,"detail":"Повторите попытку позже"}';
}

error_page 502 503 504 = @upstream_unavailable;
location @upstream_unavailable {
    default_type application/problem+json;
    include /etc/nginx/snippets/security-headers.conf;
    return 503 '{"type":"about:blank","title":"Сервис недоступен","status":503,"detail":"Повторите попытку позже"}';
}
