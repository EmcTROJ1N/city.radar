# Заголовки безопасности (OWASP ASVS L1). Подключается в оба server-блока.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# Геолокация нужна карте («где я сейчас»), остальное приложению недоступно.
add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Прокси отдаёт только JSON API. TODO: при раздаче статики фронтенда ослабить CSP до политики
# приложения (script-src 'self', style-src 'self', connect-src 'self', img-src 'self' data:).
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
